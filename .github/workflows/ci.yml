name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # The full suite includes inert native fixtures linking Apple frameworks.
    # This job does not authorize or activate system routing.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: third_party/browseforge/go.sum
      - run: npm ci
      - run: npm run build
      - name: Prepare pinned core for loopback-only protocol tests
        run: |
          npm run proxy:prepare
          mkdir -p build/app-routing/macos-pf test-artifacts/mac-pf-routing
          cp build/proxy-core/mihomo build/app-routing/macos-pf/mihomo
      - run: node --test --test-concurrency=2 tests/*.test.mjs
      - run: npm run test:sites
      - run: go test ./...
        working-directory: third_party/browseforge
      - run: npm run backend:prepare
      - name: Check build contract
        run: |
          test -f dist/client/index.html
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
